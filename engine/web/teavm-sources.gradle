ext.teavmRelativeMugenPath = { File file, String marker ->
    String path = file.absolutePath.replace('\\', '/')
    int idx = path.indexOf('/' + marker + '/')
    if (idx < 0) {
        return null
    }
    String rel = path.substring(idx + marker.length() + 2)
    if (!rel.startsWith(teavmMugenPackage)) {
        return null
    }
    return rel.substring(teavmMugenPackage.length())
}

ext.teavmMatchesExclude = { String relPath, List excludes ->
    for (String rule : excludes) {
        if (rule.endsWith('/')) {
            if (relPath.startsWith(rule)) {
                return true
            }
        } else if (relPath == rule || relPath.endsWith('/' + rule)) {
            return true
        }
    }
    return false
}

ext.teavmIsEngineMainAllowed = { String relPath ->
    if (teavmEngineMainExplicitIncludes.contains(relPath)) {
        return true
    }
    for (String prefix : teavmEngineMainIncludePrefixes) {
        if (relPath.startsWith(prefix + '/')) {
            return true
        }
    }
    if (teavmMatchesExclude(relPath, teavmEngineMainExcludes)) {
        return false
    }
    // Mirror JMugen.gwt.xml <source path=""> catch-all (everything except excludes).
    return true
}

ext.teavmIsCommonAllowed = { String relPath ->
    if (teavmCommonExplicitIncludes.contains(relPath)) {
        return true
    }
    for (String prefix : teavmCommonIncludePrefixes) {
        if (relPath.startsWith(prefix + '/')) {
            return true
        }
    }
    return false
}

ext.teavmCollectCuratedEngineSources = {
    def root = rootProject.projectDir
    def result = new LinkedHashSet<File>()

    def commonMarker = 'engine/common/src/main/java'
    fileTree("${root}/${commonMarker}/${teavmMugenPackage}") {
        include '**/*.java'
    }.each { File file ->
        String rel = teavmRelativeMugenPath(file, commonMarker)
        if (rel != null && teavmIsCommonAllowed(rel)) {
            result.add(file)
        }
    }

    def propsMarker = 'engine/properties/src/main/java'
    fileTree("${root}/${propsMarker}/${teavmMugenPackage}") {
        include '**/*.java'
        exclude 'gwt/**'
    }.each { File file ->
        String rel = teavmRelativeMugenPath(file, propsMarker)
        if (rel != null && !teavmPropertiesExcludes.contains(rel)) {
            result.add(file)
        }
    }

    teavmEngineMainRoots.each { String marker ->
        fileTree("${root}/${marker}/${teavmMugenPackage}") {
            include '**/*.java'
            exclude '**/gwt/**'
        }.each { File file ->
            String rel = teavmRelativeMugenPath(file, marker)
            if (rel != null && teavmIsEngineMainAllowed(rel)) {
                result.add(file)
            }
        }
    }

    return result
}

ext.teavmCollectCuratedSources = {
    Set<File> result = new LinkedHashSet<>(teavmCollectCuratedEngineSources())

    def coreMarker = 'core/src/main/java'
    fileTree("${rootProject.projectDir}/${coreMarker}/${teavmMugenPackage}") {
        include '**/*.java'
    }.each { File file ->
        String rel = teavmRelativeMugenPath(file, coreMarker)
        if (rel != null && !teavmMatchesExclude(rel, teavmCoreExcludes)) {
            result.add(file)
        }
    }

    return result
}
