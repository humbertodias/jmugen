<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>JMugen - LibGDX Web</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        /* LibGDX GWT preloads /assets/assets.txt before starting; keep this below the WebGL canvas. */
        canvas {
            position: relative;
            z-index: 2;
        }
        #jmugen-status {
            position: absolute;
            left: 16px;
            top: 16px;
            max-width: 720px;
            color: #ddd;
            font: 14px/1.4 Arial, sans-serif;
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid #444;
            padding: 12px 14px;
            z-index: 1;
            pointer-events: none;
        }
        #jmugen-status strong {
            color: #fff;
        }
        #jmugen-audio-hint {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            color: #eee;
            font: 15px/1.4 Arial, sans-serif;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #555;
            padding: 10px 16px;
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="jmugen-status">
    <strong>Carregando JMugen Web...</strong><br>
    Se esta mensagem nao mudar, o modulo GWT ainda nao terminou de carregar.
</div>
<div id="jmugen-audio-hint">Clique ou pressione uma tecla para ativar o audio</div>
<script src="jmugen/jmugen.nocache.js"></script>
</body>
</html>
