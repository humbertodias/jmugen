<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <title>JMugen - LibGDX Web</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: relative;
            z-index: 2;
            border: none;
        }
        #jmugen-status {
            position: absolute;
            left: 16px;
            top: 16px;
            max-width: 720px;
            color: #ddd;
            font: 14px/1.4 Arial, sans-serif;
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid #444;
            padding: 12px 14px;
            z-index: 1;
            pointer-events: none;
        }
        #jmugen-status strong {
            color: #fff;
        }
        #jmugen-audio-hint {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            color: #eee;
            font: 15px/1.4 Arial, sans-serif;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #555;
            padding: 10px 16px;
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body oncontextmenu="return false">
<canvas id="canvas"></canvas>
<script>
    async function start() {
        try {
            await main();
        } catch (err) {
            var status = document.getElementById('jmugen-status');
            if (status) {
                status.innerHTML = '<strong>Error starting JMugen Web</strong><br>' + err;
                status.style.pointerEvents = 'auto';
            }
            console.error(err);
        }
    }
    window.addEventListener('load', start);
</script>
<script type="text/javascript" charset="utf-8" src="app.js"></script>
</body>
</html>
