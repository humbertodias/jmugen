name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ runner.arch }}-

      # Java 17 is required for sdkmanager
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          
          curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          
          unzip sdk.zip
          mv cmdline-tools latest
          
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          
          yes | sdkmanager --licenses
          
          sdkmanager \
            "platforms;android-34" \
            "build-tools;28.0.3" \
            "platform-tools"

      # Switch back to Java 8 for the Maven build
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '8'

      - name: Package jar
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: mvn package