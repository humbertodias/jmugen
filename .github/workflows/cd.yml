name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

env:
  MAIN_CLASS: org.lee.mugen.renderer.libgdx.LGDXDesktopMain
  # Skip Android/Web in the desktop job; each has its own job.
  MVN_DESKTOP: mvn -DskipTests -pl '!JMugen.Render.libgdx.android,!JMugen.Render.libgdx.web'

jobs:

  Desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '8'

      - name: Package LibGDX desktop jar
        run: ${{ env.MVN_DESKTOP }} -Dmain.class=${{ env.MAIN_CLASS }} package

      - name: Prepare release
        run: |
          zip -9 -r data.zip data
          cp JMugen.Debug/target/JMugen.Debug-0.0.1-SNAPSHOT.jar "jmugen-${GITHUB_REF_NAME}-libgdx.jar"
          ls -lha jmugen-*-libgdx.jar data.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            data.zip
            jmugen-*-libgdx.jar

  Web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-web-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-web-${{ runner.os }}-

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '8'

      - name: Package LibGDX web
        run: |
          mvn install -DskipTests -pl '!JMugen.Render.libgdx.android'
          mvn -pl JMugen.Render.libgdx.web -am package -DskipTests
          mvn -pl JMugen.Render.libgdx.web -rf :JMugen.Render.libgdx.web gwt:compile
          cp JMugen.Render.libgdx.web/src/main/webapp/index.html JMugen.Render.libgdx.web/target/webapp/index.html
          cp -r JMugen.Render.libgdx.web/src/main/webapp/assets JMugen.Render.libgdx.web/target/webapp/
          (cd JMugen.Render.libgdx.web/target/webapp && zip -9 -r "../../../jmugen-${GITHUB_REF_NAME}-libgdx-web.zip" .)
          ls -lha jmugen-*-libgdx-web.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            jmugen-*-libgdx-web.zip

  Android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-android-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-android-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q sdk.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;28.0.3" \
            "platform-tools"
          cd $ANDROID_HOME
          curl -L -o tools.zip https://dl.google.com/android/repository/tools_r25.2.5-linux.zip
          unzip -q tools.zip

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '8'

      - name: Package LibGDX Android APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          mvn -DskipTests -pl JMugen.Render.libgdx.android -am package
          APK=$(find JMugen.Render.libgdx.android/target -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "jmugen-${GITHUB_REF_NAME}-libgdx-android.apk"
          ls -lha jmugen-*-android.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            jmugen-*-libgdx-android.apk
