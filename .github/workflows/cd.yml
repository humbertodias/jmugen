name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:

  Desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Package desktop release jar
        run: ./gradlew :tools-debug:shadowJar

      - name: Prepare release
        run: |
          zip -9 -r assets.zip assets
          cp tools/JMugen.Debug/build/libs/JMugen.Debug-*.jar "jmugen-${GITHUB_REF_NAME}-libgdx.jar"
          ls -lha jmugen-*-libgdx.jar assets.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            assets.zip
            jmugen-*-libgdx.jar

  Web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-web-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-web-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Package LibGDX web
        run: |
          ./gradlew :html:distWeb
          (cd html/build/webapp && zip -9 -r "../../../jmugen-${GITHUB_REF_NAME}-libgdx-web.zip" .)
          ls -lha jmugen-*-libgdx-web.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            jmugen-*-libgdx-web.zip

  Android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q sdk.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Package LibGDX Android APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew -Pandroid :android:assembleDebug
          APK=$(find android/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "jmugen-${GITHUB_REF_NAME}-libgdx-android.apk"
          ls -lha jmugen-*-android.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            jmugen-*-libgdx-android.apk
