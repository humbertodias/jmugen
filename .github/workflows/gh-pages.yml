name: gh-pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Build web
        run: ./gradlew :html:distWeb

      - name: Verify deploy artifact size
        run: |
          test -f html/build/webapp/app.js
          test ! -d html/build/webapp/gwt-unitCache
          find html/build/webapp -type f -size +95M -print -quit | grep -q . && exit 1 || true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: html/build/webapp/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: html/build/webapp/
