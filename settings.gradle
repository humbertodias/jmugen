pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.github.xpenatan.gdx-teavm') {
                useModule("com.github.xpenatan.gdx-teavm:gdx-teavm-plugin:${requested.version}")
            }
        }
    }
}

plugins {
    id 'com.android.application' version '9.4.0' apply false
}

rootProject.name = 'jmugen'

// LibGDX backends (standard layout)
include 'core', 'desktop', 'html'

// Mugen engine
include 'engine'
project(':engine').projectDir = file('engine/main')
include 'engine-common'
project(':engine-common').projectDir = file('engine/common')
include 'engine-properties'
project(':engine-properties').projectDir = file('engine/properties')
include 'engine-adx'
project(':engine-adx').projectDir = file('engine/adx')
include 'engine-web'
project(':engine-web').projectDir = file('engine/web')

// Optional tooling
include 'tools-debug'
project(':tools-debug').projectDir = file('tools/JMugen.Debug')
include 'tools-launcher'
project(':tools-launcher').projectDir = file('tools/JMugen.Launcher')
include 'tools-syntax'
project(':tools-syntax').projectDir = file('tools/Syntax')

if (gradle.startParameter.projectProperties.containsKey('android')) {
    include 'android'
}
