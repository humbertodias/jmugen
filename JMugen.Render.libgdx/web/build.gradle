plugins {
    id 'java-library'
    id 'org.docstr.gwt' version '2.2.9'
}

group = 'JMugen.Render.libgdx.web'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.java {
    exclude '**/gwt/**'
    exclude '**/Gwt*.java'
}

configurations {
    gwtSources {
        transitive = false
    }
}

dependencies {
    implementation project(':libgdx-core')
    implementation project(':jmugen-properties')
    implementation(project(':jmugen-engine')) {
        exclude group: 'com.googlecode.soundlibs', module: 'mp3spi'
        exclude group: 'com.googlecode.soundlibs', module: 'vorbisspi'
        exclude group: 'com.googlecode.soundlibs', module: 'tritonus-share'
    }
    implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion"
    gwtSources("com.badlogicgames.gdx:gdx:$gdxVersion") {
        artifact { classifier = 'sources' }
    }
    gwtSources("com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion") {
        artifact { classifier = 'sources' }
    }
}

def gwtProjectModules = [':jmugen-engine', ':jmugen-common', ':jmugen-properties', ':libgdx-core']

def gwtModuleSourceDirs = gwtProjectModules.collectMany { path ->
    def p = project(path)
    p.sourceSets.main.java.srcDirs + p.sourceSets.main.resources.srcDirs
}

tasks.register('syncGdxAssets', Copy) {
    from "${rootProject.projectDir}/data"
    into layout.buildDirectory.dir('gdx-assets/data')
}

// LibGDX GWT sources (for gwtCompile only — not javac).
tasks.register('unpackGwtLibSources', Sync) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from configurations.gwtSources.collect { zipTree(it) }
    into layout.buildDirectory.dir('gwt-lib-src')
}

gwt {
    gwtVersion = providers.gradleProperty('gwtVersion').get()
    modules = ['org.lee.mugen.renderer.libgdx.web.JMugenWeb']
    style = 'PRETTY'
    maxHeapSize = '1024M'
    minHeapSize = '512M'
    war = layout.buildDirectory.dir('gwt').get().asFile
    extraSourceDirs = files(gwtModuleSourceDirs)
    devMode {
        port = 8888
        codeServerPort = 9876
        startupUrl = 'http://127.0.0.1:8888/index.html'
    }
}

tasks.named('gwtCompile').configure {
    dependsOn syncGdxAssets, unpackGwtLibSources
    // Append LibGDX source trees without polluting compileJava (Gradle 9 task validation).
    gwt.extraSourceDirs.from(layout.buildDirectory.dir('gwt-lib-src'))
}

tasks.register('distWeb') {
    group = 'build'
    description = 'GWT output + static webapp for gh-pages / static hosting'
    dependsOn tasks.named('gwtCompile')
    doLast {
        def webappDir = layout.buildDirectory.dir('webapp').get().asFile
        webappDir.mkdirs()
        copy {
            from "${projectDir}/src/main/webapp"
            into webappDir
        }
        copy {
            from layout.buildDirectory.dir('gwt')
            into webappDir
        }
    }
}

// Alias for docs/scripts that still say compileGwt
tasks.register('compileGwt') {
    dependsOn tasks.named('gwtCompile')
}
